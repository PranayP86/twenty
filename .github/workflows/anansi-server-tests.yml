name: anansi-server-tests

on:
  push:
    branches: [anansi]
  workflow_dispatch:

permissions:
  contents: read

# ANANSI PATCH: test gate for server-side Anansi patches (starting with the
# allowlist-gated workspace-creation check in
# packages/twenty-server/src/engine/core-modules/auth/services/sign-in-up.service.ts
# and anansi-allowlist.service.ts). Runs only the Anansi-owned spec files —
# not the full upstream twenty-server suite (see .github/workflows/ci-server.yaml
# for that, which only triggers on pull_request/merge_group, not push).
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install dependencies
        uses: ./.github/actions/yarn-install
      # ANANSI PATCH: build twenty-server's full workspace-dependency set
      # (twenty-shared, twenty-emails, twenty-client-sdk — see
      # packages/twenty-server/package.json's workspace:* deps, the same set
      # packages/twenty-docker/twenty/Dockerfile focuses/installs for
      # twenty-server) so nothing transitively required at module-load time
      # (e.g. approved-access-domain.service.ts importing twenty-emails) is
      # missing when jest requires sign-in-up.service.ts.
      - name: Build workspace dependencies
        run: npx nx run-many --target=build --projects=twenty-shared,twenty-emails,twenty-client-sdk
      - name: Run Anansi server tests
        run: |
          npx jest --config packages/twenty-server/jest.config.mjs --ci --runInBand \
            "anansi-allowlist\.service\.spec\.ts|sign-in-up\.service\.spec\.ts"
